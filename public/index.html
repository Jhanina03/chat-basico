<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chat en tiempo real con videollamada">
  <title>Chat Básico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="join-screen" class="join">
      <h1>Chat Básico</h1>
      <p>Escribe tu nombre para entrar al chat.</p>
      <div id="join-box" class="join-form" role="group" aria-labelledby="name-label">
        <label id="name-label" for="name-input">Tu nombre</label>
        <input id="name-input" type="text" autocomplete="off" enterkeyhint="go">
        <button id="join-button" type="button">Entrar</button>
      </div>
      <p class="source">
        <a href="https://github.com/Jhanina03/chat-basico" target="_blank" rel="noopener noreferrer">Código fuente</a>
      </p>
    </section>

    <section id="chat-screen" class="chat" hidden>
      <header class="chat-header">
        <h1>Chat Básico</h1>
        <span id="status" class="status">Conectando…</span>
      </header>

      <div class="chat-body">
        <aside class="users" aria-labelledby="users-title">
          <h2 id="users-title">Conectados</h2>
          <ul id="user-list" class="user-list"></ul>
        </aside>

        <ul id="messages" class="messages" aria-live="polite"></ul>
      </div>

      <div id="composer" class="message-form" role="group" aria-label="Escribir mensaje">
        <label for="message-input" class="visually-hidden">Mensaje</label>
        <input id="message-input" type="text" placeholder="Escribe un mensaje" autocomplete="off" enterkeyhint="send">
        <button id="send-button" type="button">Enviar</button>
      </div>
    </section>
  </main>

  <div id="incoming-call" class="incoming-call" role="alertdialog" aria-labelledby="incoming-text" hidden>
    <p id="incoming-text"></p>
    <div class="incoming-actions">
      <button id="accept-call" type="button" class="accept">Contestar</button>
      <button id="reject-call" type="button" class="reject">Rechazar</button>
    </div>
  </div>

  <section id="call-panel" class="call-panel" aria-labelledby="call-status" hidden>
    <video id="remote-video" class="remote-video" autoplay playsinline></video>
    <video id="local-video" class="local-video" autoplay playsinline muted></video>
    <div class="call-bar">
      <p id="call-status" class="call-status"></p>
      <button id="hang-up" type="button" class="reject">Colgar</button>
    </div>
  </section>

  <script src="/vendor/socket.io.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
